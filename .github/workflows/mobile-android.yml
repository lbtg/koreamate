name: Android preview APK
on:
  push:
    branches: [rebuild/full-platform, 'claude/**']
    paths: ['src/**', 'public/**', 'android/**', 'package*.json', 'capacitor.config.json', 'scripts/build-mobile.mjs', '.github/workflows/mobile-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      # v4 installs only platform-tools; v3 still asked for the retired `tools`
      # package, so every run died in setup with "Failed to find package 'tools'".
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run mobile:preview
        env:
          VITE_API_ORIGIN: ${{ vars.MOBILE_API_ORIGIN || 'https://koreamate-du4rgw200-lbtg9806-8210s-projects.vercel.app' }}
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: KoreaMate-Android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
