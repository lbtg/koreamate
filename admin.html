<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoreaMate Admin</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Arial;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:24px 18px}.logo{font-size:22px;font-weight:850;margin-bottom:30px}.logo span{color:#818cf8}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:12px 14px;border-radius:12px;cursor:pointer;margin:3px 0}.nav button.active,.nav button:hover{background:#1f2937;color:white}.main{padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.top h1{margin:0}.top a{color:var(--accent);text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.stat small{color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:8px}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px;overflow:auto}.panel h2{margin:0 0 14px;font-size:19px}.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools input,.tools select{padding:10px 12px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:10px;padding:10px 12px;background:#111827;color:white;cursor:pointer}.btn.alt{background:#eef2ff;color:#3730a3}.btn.danger{background:#fee2e2;color:#991b1b}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--muted);font-weight:700}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#f2f4f7;font-size:12px}.empty{color:var(--muted);padding:20px 0}.section{display:none}.section.active{display:block}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:20;padding:12px}.logo{margin:0 0 10px}.nav{display:flex;gap:4px;overflow:auto}.nav button{white-space:nowrap;width:auto}.main{padding:16px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="layout"><aside class="side"><div class="logo">Korea<span>Mate</span> Admin</div><div class="nav"><button class="active" data-tab="dashboard">概览</button><button data-tab="orders">订单</button><button data-tab="mates">地陪审核</button><button data-tab="risk">客诉/风控</button></div></aside><main class="main"><div class="top"><div><h1>管理后台</h1><div style="color:#667085;margin-top:5px">MVP 本地数据演示版</div></div><a href="index.html">← 返回网站</a></div><section id="dashboard" class="section active"><div class="stats"><div class="stat"><small>本浏览器订单</small><b id="sOrders">0</b></div><div class="stat"><small>待确认</small><b id="sPending">0</b></div><div class="stat"><small>地陪申请</small><b id="sApps">0</b></div><div class="stat"><small>待审核</small><b id="sReview">0</b></div></div><div class="panel"><h2>运营提醒</h2><p style="color:#667085;line-height:1.8">当前版本使用浏览器 localStorage，仅用于前端原型测试。正式上线商业运营前，应把订单、用户、地陪、审核、支付和日志迁移到服务端数据库，并为后台增加登录、权限与审计。</p></div></section><section id="orders" class="section"><div class="panel"><h2>订单管理</h2><div class="tools"><input id="qOrder" placeholder="搜索姓名/订单号/服务"><select id="statusFilter"><option value="all">全部状态</option><option>待确认</option><option>已确认</option><option>已完成</option><option>已取消</option></select><button class="btn alt" onclick="exportOrders()">导出 JSON</button></div><div id="ordersTable"></div></div></section><section id="mates" class="section"><div class="panel"><h2>地陪入驻审核</h2><div class="tools"><input id="qApp" placeholder="搜索姓名/地区/语言"></div><div id="appsTable"></div></div></section><section id="risk" class="section"><div class="panel"><h2>客诉与风控</h2><div class="empty">当前 Demo 暂无风险事件。正式版建议至少加入：订单纠纷、取消退款、危险行为举报、证件复核、黑名单、后台操作日志。</div></div></section></main></div><script>const $=id=>document.getElementById(id);function orders(){return JSON.parse(localStorage.getItem('km_orders')||'[]')}function apps(){return JSON.parse(localStorage.getItem('km_applications')||'[]')}function saveOrders(x){localStorage.setItem('km_orders',JSON.stringify(x))}function saveApps(x){localStorage.setItem('km_applications',JSON.stringify(x))}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');render()});function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setOrder(id,status){let a=orders();let o=a.find(x=>x.id===id);if(o)o.status=status;saveOrders(a);render()}function delOrder(id){if(confirm('确认删除此订单？')){saveOrders(orders().filter(x=>x.id!==id));render()}}function setApp(id,status){let a=apps();let o=a.find(x=>x.id===id);if(o)o.status=status;saveApps(a);render()}function delApp(id){if(confirm('确认删除此申请？')){saveApps(apps().filter(x=>x.id!==id));render()}}function renderOrders(){let a=orders(),q=($('qOrder')?.value||'').toLowerCase(),st=$('statusFilter')?.value||'all';a=a.filter(o=>(!q||[o.id,o.name,o.service,o.contact].join(' ').toLowerCase().includes(q))&&(st==='all'||o.status===st));$('ordersTable').innerHTML=a.length?`<table><thead><tr><th>订单</th><th>用户</th><th>服务</th><th>日期/时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.id)}</td><td><b>${esc(o.name)}</b><br><small>${esc(o.contact)}</small></td><td>${esc(o.service)} · ${esc(o.hours)}</td><td>${esc(o.date)} ${esc(o.time||'')}</td><td><span class="badge">${esc(o.status)}</span></td><td><select onchange="setOrder('${o.id}',this.value)"><option ${o.status==='待确认'?'selected':''}>待确认</option><option ${o.status==='已确认'?'selected':''}>已确认</option><option ${o.status==='已完成'?'selected':''}>已完成</option><option ${o.status==='已取消'?'selected':''}>已取消</option></select> <button class="btn danger" onclick="delOrder('${o.id}')">删除</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无订单。请先在前台提交一条 Demo 预约。</div>'}function renderApps(){let a=apps(),q=($('qApp')?.value||'').toLowerCase();a=a.filter(o=>!q||[o.name,o.area,o.langs,o.contact].join(' ').toLowerCase().includes(q));$('appsTable').innerHTML=a.length?`<table><thead><tr><th>申请ID</th><th>姓名</th><th>语言/地区</th><th>状态</th><th>操作</th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.id)}</td><td><b>${esc(o.name)}</b><br><small>${esc(o.contact)}</small></td><td>${esc(o.langs)}<br>${esc(o.area)}</td><td><span class="badge">${esc(o.status)}</span></td><td><select onchange="setApp('${o.id}',this.value)"><option ${o.status==='待审核'?'selected':''}>待审核</option><option ${o.status==='面试中'?'selected':''}>面试中</option><option ${o.status==='已通过'?'selected':''}>已通过</option><option ${o.status==='未通过'?'selected':''}>未通过</option></select> <button class="btn danger" onclick="delApp('${o.id}')">删除</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无地陪申请。</div>'}function exportOrders(){let blob=new Blob([JSON.stringify(orders(),null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='koreamate-orders.json';a.click();URL.revokeObjectURL(u)}function render(){let o=orders(),a=apps();$('sOrders').textContent=o.length;$('sPending').textContent=o.filter(x=>x.status==='待确认').length;$('sApps').textContent=a.length;$('sReview').textContent=a.filter(x=>x.status==='待审核').length;renderOrders();renderApps()}['qOrder','qApp'].forEach(id=>$(id).oninput=render);$('statusFilter').onchange=render;render();</script></body></html>
